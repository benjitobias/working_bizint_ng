# Use postgres/example user/password credentials
version: '3.1'

services:
  bizint_db:
    image: postgres
    container_name: bizint_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./.env.db.prod
  bizint_web:
    restart: always
    container_name: bizint_web
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: gunicorn bizint_ng.wsgi:application --bind 0.0.0.0:8000
    expose:
      - 8000
    depends_on:
      - bizint_db
    volumes:
      - /srv/bizint-static:/app/static
    env_file:
      - ./.env.prod
    networks:
      - default
      - shared_proxy


volumes:
  postgres_data:

networks:
  shared_proxy:
    external: true

