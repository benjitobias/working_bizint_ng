# Use postgres/example user/password credentials
version: '3.1'

services:
  bizint_db:
    image: postgres
    container_name: bizint_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
   #   - static_files:/bizint_ng/bizint_ng/static
    ports:
      - "5432:5432"
        #network_mode: 'host'
    environment:
      POSTGRES_PASSWORD: Aa123123
      POSTGRES_USER: bizint_ng
      POSTGRES_DB: bizint_ng
  bizint_web:
    container_name: bizint_web
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: gunicorn bizint_ng.wsgi:application --bind 0.0.0.0:8000
    # volumes:
    #   - ./bizint_ng:/bizint_ng
    expose:
      - 8000
    depends_on:
      - bizint_db
  nginx:
    build: ./nginx
    ports:
      - 80:80
    depends_on:
      - bizint_web
    #volumes: static_files:/bizint_ng/bizint_ng/static


volumes:
  postgres_data:
  #static_files:

