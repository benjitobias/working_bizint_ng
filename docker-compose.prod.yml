# Use postgres/example user/password credentials
version: '3.1'

services:
  bizint_db:
    image: postgres
    container_name: bizint_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "127.0.0.1:5432:5432"
    env_file:
      - ./.env.db.prod
  bizint_web:
    container_name: bizint_web
    build:
      context: .
      dockerfile: Dockerfile.prod
    command: gunicorn bizint_ng.wsgi:application --bind 0.0.0.0:8000
    expose:
      - 8000
    depends_on:
      - bizint_db
    volumes:
      - static_files:/app/static
    env_file:
      - ./.env.prod
  nginx:
    container_name: bizint_nginx
    build: ./nginx
    ports:
      - 80:80
    depends_on:
      - bizint_web
    volumes:
      - static_files:/app/static
      - /etc/letsencrypt:/etc/letsencrypt:ro


volumes:
  postgres_data:
  static_files:

